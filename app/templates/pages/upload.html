{% extends "base.html" %}

{% block title %}上傳檔案 - Files-App{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-sm p-6 h-full flex flex-col overflow-y-auto">
    <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200 flex-shrink-0">
        <h2 class="text-xl font-semibold text-gray-800">上傳檔案</h2>
    </div>
    <div class="text-gray-500 flex-1 overflow-y-auto">
        <!-- Upload Area -->
        <div class="border-2 border-dashed border-gray-200 rounded-lg p-12 text-center transition-all hover:border-blue-500 hover:bg-blue-50 bg-white mb-6" id="uploadArea">
            <div class="text-6xl mb-4">📤</div>
            <h3 class="mb-2 text-gray-800">拖放檔案到這裡</h3>
            <p class="text-gray-500 mb-6">或點擊下方按鈕選擇檔案</p>
            <input type="file" id="fileInput" multiple class="hidden">
            <button class="px-6 py-3 bg-blue-500 text-white font-medium rounded-lg cursor-pointer transition-all hover:bg-blue-600 hover:-translate-y-0.5 hover:shadow-md" onclick="document.getElementById('fileInput').click()">選擇檔案</button>
        </div>

        <!-- Upload Form -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-800">上傳表單</h3>
            </div>
            <div class="text-gray-500">
                <form id="uploadForm">
                    <div class="mb-6">
                        <label class="block mb-2 font-medium text-gray-800">選擇檔案</label>
                        <input type="file" class="w-full px-3 py-3 border border-gray-200 rounded-lg text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all" multiple>
                    </div>
                    <div class="mb-6">
                        <label class="block mb-2 font-medium text-gray-800">目標資料夾</label>
                        <select class="w-full px-3 py-3 border border-gray-200 rounded-lg text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all">
                            <option value="/">根目錄</option>
                            <option value="/documents">文件</option>
                            <option value="/images">圖片</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block mb-2 font-medium text-gray-800">備註（選填）</label>
                        <textarea class="w-full px-3 py-3 border border-gray-200 rounded-lg text-base font-sans resize-y focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all" rows="3" placeholder="輸入檔案備註..."></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" class="px-6 py-3 bg-blue-500 text-white font-medium rounded-lg cursor-pointer transition-all hover:bg-blue-600 hover:-translate-y-0.5 hover:shadow-md">上傳</button>
                        <button type="reset" class="px-6 py-3 bg-transparent border-2 border-blue-500 text-blue-500 rounded-lg transition-all hover:bg-blue-500 hover:text-white">重置</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Upload Progress (hidden by default) -->
        <div class="bg-white rounded-lg shadow-sm p-6 hidden" id="progressCard">
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-800">上傳進度</h3>
            </div>
            <div class="text-gray-500">
                <div class="bg-gray-50 h-5 rounded-lg overflow-hidden">
                    <div id="progressBar" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%;"></div>
                </div>
                <p class="text-center mt-2" id="progressText">0%</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Upload form handling (placeholder for future implementation)
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // Upload logic will be implemented later
        console.log('Upload form submitted');
    });
</script>
{% endblock %}
