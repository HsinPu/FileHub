services:
  filehub:
    build: .
    image: filehub:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_PORT:-9005}:8000"
    environment:
      FILES_ROOT: /files
      DATABASE_PATH: /app/database/users.db
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - database:/app/database
      - config:/app/config
      - files:/files
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  files:
  database:
  config:
