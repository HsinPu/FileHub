# Standalone example: docker compose -f compose.linux.yaml up -d --build --wait
# Create and authorize every host directory before startup. Do not combine with compose.yaml.
services:
  filehub:
    build:
      context: .
    image: filehub:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCKER_PORT:-9005}:8000"
    environment:
      FILES_ROOT: /srv
      DATABASE_PATH: /app/database/users.db
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      FILES_DIRECTORIES: '[{"id":"shared","name":"共用資料","path":"shared"},{"id":"reports","name":"報表","path":"reports"},{"id":"documents","name":"文件","path":"documents"}]'
    volumes:
      - database:/app/database
      - config:/app/config
      - type: bind
        source: ${DOCKER_FILES_DIR:-./srv}
        target: /srv
        bind:
          create_host_path: false
      - type: bind
        source: ${SHARED_DIR:-/data/shared}
        target: /srv/shared
        bind:
          create_host_path: false
      - type: bind
        source: ${REPORTS_DIR:-/mnt/reports}
        target: /srv/reports
        bind:
          create_host_path: false
      - type: bind
        source: ${DOCUMENTS_DIR:-/srv/documents}
        target: /srv/documents
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
volumes:
  database:
  config:
